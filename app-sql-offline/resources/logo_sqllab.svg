<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">SQLab logo</title>
  <desc id="desc">Logo for SQLab, a dark Matrix-inspired offline SQL practice application.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06100c"/>
      <stop offset="100%" stop-color="#0b1d14"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#39ff88"/>
      <stop offset="100%" stop-color="#12c96b"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="matrix" width="42" height="42" patternUnits="userSpaceOnUse">
      <text x="4" y="18" font-family="monospace" font-size="13" fill="#39ff88" opacity=".10">01</text>
      <text x="19" y="35" font-family="monospace" font-size="12" fill="#39ff88" opacity=".08">SQL</text>
    </pattern>
  </defs>

  <!-- Transparent-safe main mark -->
  <g>
    <!-- subtle matrix field -->
    <circle cx="600" cy="520" r="390" fill="url(#matrix)" opacity=".8"/>

    <!-- terminal/database symbol -->
    <g filter="url(#glow)">
      <path d="M300 390
               C300 325 435 275 600 275
               C765 275 900 325 900 390
               L900 650
               C900 715 765 765 600 765
               C435 765 300 715 300 650 Z"
            fill="#08150e" stroke="url(#green)" stroke-width="18"/>

      <!-- database layers -->
      <ellipse cx="600" cy="390" rx="300" ry="115"
               fill="#0a1b12" stroke="#39ff88" stroke-width="18"/>
      <path d="M300 390v260c0 65 135 115 300 115s300-50 300-115V390"
            fill="none" stroke="#39ff88" stroke-width="18"/>
      <path d="M300 515c0 65 135 115 300 115s300-50 300-115"
            fill="none" stroke="#20df78" stroke-width="12" opacity=".9"/>
    </g>

    <!-- SQL prompt / lab cursor -->
    <g>
      <rect x="425" y="350" width="350" height="88" rx="18"
            fill="#041009" stroke="#39ff88" stroke-width="7"/>
      <text x="465" y="409"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="48" font-weight="700" fill="#39ff88">&gt;_</text>
      <rect x="565" y="381" width="7" height="40" rx="3" fill="#39ff88">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- lab flask accent -->
    <g transform="translate(785 650) rotate(-8)">
      <path d="M30 10h110M62 10v58L18 145
               Q10 160 28 160h114
               Q160 160 152 145L108 68V10"
            fill="#07130d" stroke="#39ff88" stroke-width="10"
            stroke-linejoin="round"/>
      <path d="M39 118 Q85 94 133 118 L151 148 Q156 158 142 158H29Q15 158 22 147Z"
            fill="#18d873" opacity=".85"/>
      <circle cx="76" cy="117" r="7" fill="#9affc4"/>
      <circle cx="112" cy="130" r="5" fill="#9affc4"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g>
    <text x="600" y="925" text-anchor="middle"
          font-family="Inter, Segoe UI, Arial, sans-serif"
          font-size="154" font-weight="800" letter-spacing="-7"
          fill="#f0fff6">SQL<tspan fill="#39ff88">ab</tspan></text>
    <text x="600" y="985" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="30" letter-spacing="8"
          fill="#6ee9a5" opacity=".9">OFFLINE SQL LAB</text>
  </g>
</svg>