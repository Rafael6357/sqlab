[project]
name = "sqlab"
version = "0.8.0"
requires-python = ">=3.11"
dependencies = ["PySide6==6.10.1"]

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "spec(name): marca que vincula un test con una spec en specs/ (usado en AGENTS.md Metodología)",
]
