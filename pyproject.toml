[project]
name = "sqlab"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = ["PySide6==6.10.1", "openpyxl>=3.1", "xlrd==2.0.1"]
license = { text = "MIT" }

[tool.pytest.ini_options]
qt_api = "pyside6"
testpaths = ["tests"]
addopts = "-q --tb=short"
markers = [
    "spec(name): marca que vincula un test con una spec en specs/ (usado en AGENTS.md Metodología)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# F = bugs reales (imports/vars sin uso, nombres indefinidos).
# E501 excluido a propósito: los literales de UI en español son largos
# y partirlos no aporta; el gate es `ruff check .`.
select = ["F"]
